<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Integration Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #3b82f6;
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-color: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .sidebar {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .graph-container {
            flex: 2;
            position: relative;
            min-height: 400px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #fafafa;
            padding: 10px;
        }

        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #0f172a;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #64748b;
        }

        input {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        .limits-group {
            display: flex;
            gap: 10px;
        }

        .limits-group .input-group {
            flex: 1;
        }

        .result-panel {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 15px;
            border-radius: 8px;
            margin-top: auto;
        }

        .result-title {
            font-size: 0.875rem;
            color: #1e40af;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1d4ed8;
            font-family: monospace;
        }

        .error {
            color: #dc2626;
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.875rem;
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .graph-container {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>Integration Calculator</h2>
        
        <div class="input-group">
            <label for="function-input">Function f(x)</label>
            <input type="text" id="function-input" value="x^2 - 2x" placeholder="e.g., x^2, sin(x), exp(x)">
        </div>

        <div class="limits-group">
            <div class="input-group">
                <label for="limit-a">Lower Limit (a)</label>
                <input type="number" id="limit-a" value="0" step="any">
            </div>
            <div class="input-group">
                <label for="limit-b">Upper Limit (b)</label>
                <input type="number" id="limit-b" value="3" step="any">
            </div>
        </div>

        <div id="error-message" class="error"></div>

        <div class="result-panel">
            <div class="result-title">Definite Integral Value</div>
            <div id="result-display" class="result-value">0.00</div>
        </div>
    </div>

    <div class="graph-container">
        <canvas id="graphCanvas"></canvas>
    </div>
</div>

<script>
    // Initialize elements
    const fxInput = document.getElementById('function-input');
    const limitAInput = document.getElementById('limit-a');
    const limitBInput = document.getElementById('limit-b');
    const resultDisplay = document.getElementById('result-display');
    const errorDiv = document.getElementById('error-message');
    const ctx = document.getElementById('graphCanvas').getContext('2d');

    let chart;

    // Numerical integration using Simpson's Rule
    function simpsonsRule(f, a, b, n = 1000) {
        if (n % 2 !== 0) n++; // n must be even
        const h = (b - a) / n;
        let sum = f(a) + f(b);

        for (let i = 1; i < n; i++) {
            const x = a + i * h;
            sum += i % 2 === 0 ? 2 * f(x) : 4 * f(x);
        }
        return (h / 3) * sum;
    }

    // Main update logic
    function update() {
        errorDiv.style.display = 'none';
        
        const exprString = fxInput.value;
        const a = parseFloat(limitAInput.value);
        const b = parseFloat(limitBInput.value);

        if (isNaN(a) || isNaN(b)) return;

        try {
            // Compile the math expression safely via Math.js
            const compiledExpr = math.compile(exprString);
            const f = (x) => compiledExpr.evaluate({ x: x });

            // Test evaluation to catch syntax/domain errors early
            f(a);

            // Calculate the integral value
            const integralVal = simpsonsRule(f, a, b);
            resultDisplay.textContent = isNaN(integralVal) ? "Undefined" : integralVal.toFixed(4);

            // Dynamically build graph window padding based on borders
            const minX = Math.min(a, b) - 2;
            const maxX = Math.max(a, b) + 2;
            const step = (maxX - minX) / 150;

            const linePoints = [];
            const filledPoints = [];

            // Generate datasets for rendering
            for (let x = minX; x <= maxX; x += step) {
                try {
                    const y = f(x);
                    if (typeof y === 'number' && !isNaN(y) && isFinite(y)) {
                        linePoints.push({ x: x, y: y });
                        
                        // If within integration limits, capture points for shading
                        if (x >= Math.min(a, b) && x <= Math.max(a, b)) {
                            filledPoints.push({ x: x, y: y });
                        }
                    }
                } catch(e) {}
            }

            updateChart(linePoints, filledPoints, a, b);

        } catch (error) {
            errorDiv.textContent = "Error: Invalid math expression.";
            errorDiv.style.display = 'block';
            resultDisplay.textContent = "Error";
        }
    }

    // Render/refresh data visualization using Chart.js
    function updateChart(lineData, fillData, a, b) {
        if (chart) {
            chart.destroy();
        }

        chart = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [
                    {
                        label: 'f(x)',
                        data: lineData,
                        showLine: true,
                        borderColor: '#2563eb',
                        borderWidth: 2.5,
                        pointRadius: 0,
                        fill: false
                    },
                    {
                        label: 'Integrated Area',
                        data: fillData,
                        showLine: true,
                        borderColor: 'transparent',
                        pointRadius: 0,
                        backgroundColor: 'rgba(59, 130, 246, 0.3)',
                        fill: 'origin' // Shades the space between the curve and the y=0 axis
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        grid: { color: '#e2e8f0' }
                    },
                    y: {
                        type: 'linear',
                        grid: { color: '#e2e8f0' }
                    }
                }
            }
        });
    }

    // Add event listeners to trigger immediate recalculations upon inputs
    fxInput.addEventListener('input', update);
    limitAInput.addEventListener('input', update);
    limitBInput.addEventListener('input', update);

    // Initial render call
    update();
</script>
</body>
</html>
